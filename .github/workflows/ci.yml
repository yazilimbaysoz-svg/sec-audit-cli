name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup environment
        run: uv venv && uv pip install -e '.[dev]'
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest --cov=sec_audit --cov-report=term-missing
      - name: Semgrep
        run: uvx semgrep scan --config semgrep-rules.yml --error src tests
