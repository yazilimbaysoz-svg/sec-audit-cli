[project]
name = "sec-audit-cli"
version = "0.1.0"
description = "Tek komutla gizli anahtar, zafiyetli paket ve OWASP riski tarayan hizli guvenlik CLI araci"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baysoz Yazilim", email = "info@baysoz.example" }]
keywords = ["security", "audit", "secrets", "owasp", "vulnerability", "cli", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
sec-audit = "sec_audit.cli:main"

[project.urls]
Homepage = "https://github.com/yazilimbaysoz-svg/sec-audit-cli"
Repository = "https://github.com/yazilimbaysoz-svg/sec-audit-cli"
Issues = "https://github.com/yazilimbaysoz-svg/sec-audit-cli/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
